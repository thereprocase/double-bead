name: diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.14"]
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.12"
          - os: macos-15-intel
            python-version: "3.12"
          - os: windows-11-arm
            python-version: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "--only-binary=:all:" -r requirements.txt
      - run: python -m pip freeze
      - run: python diag/diagnose.py --reference diag/reference-linux.json --out diag-out/${{ matrix.os }}-py${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-${{ matrix.os }}-py${{ matrix.python-version }}
          path: diag-out/
