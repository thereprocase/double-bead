name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a branch getting force-pushed) so we don't
# burn runner time on commits nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "--only-binary=:all:" -r requirements.txt
      - run: python -m unittest discover -s tests

  reproducible-build:
    name: reproducible build (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "--only-binary=:all:" -r requirements.txt
      # requirements.txt intentionally omits uharfbuzz, so fontTools falls back to its
      # pure-Python GPOS packer here. That packer's output is what the committed fonts were
      # built with; installing uharfbuzz would change GPOS packing and break this check
      # (see docs/DEVELOPMENT.md's reproducibility notes).
      - run: python build.py
      - name: fail if the rebuild changed the committed fonts
        run: |
          git status --porcelain fonts
          test -z "$(git status --porcelain fonts)"
