name: test

# What runs where (docs/DEVELOPMENT.md, "Continuous integration"):
#   push to main   every test on every platform, including those comparing the committed fonts with the
#                  sources; the build job rebuilds the fonts and fails unless they match the committed ones.
#   pull request   contributions are source-only (docs/TUNER.md), so the committed fonts may predate the
#                  sources: the matrix skips the tests that compare the two (tests/fillaprint_env.py), and
#                  the build job runs them on fonts built from the pull request's sources. Stale committed
#                  fonts only get a notice, unless the pull request itself changes fonts/.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a branch getting force-pushed) so we don't
# burn runner time on commits nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, not the -latest labels, which move without a commit here. ubuntu-24.04: see the build
        # job. macos-26 (arm64) and windows-2025 are the images the tests' macOS and Windows slack was measured
        # on (docs/DEVELOPMENT.md, "Platforms"); a newer image may round differently, so move to one in a
        # commit of its own and re-measure.
        os: [ubuntu-24.04, macos-26, windows-2025]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "--only-binary=:all:" -r requirements.txt
      # -v prints each skipped test with its reason.
      - name: run the tests
        env:
          FILLAPRINT_COMMITTED_FONTS_MAY_BE_STALE: ${{ github.event_name == 'pull_request' && '1' || '' }}
          FILLAPRINT_REQUIRE_REFERENCE: ${{ startsWith(matrix.os, 'ubuntu-') && '1' || '' }}
        run: python -m unittest discover -s tests -v

  build:
    name: build fonts from sources (ubuntu, py3.12)
    # Pinned. The release geometry's reference is glibc's math library (docs/DEVELOPMENT.md, "Platforms"):
    # a build on this image (glibc 2.39) matched the committed fonts byte for byte. ubuntu-latest moves to a
    # new Ubuntu, and a new glibc, without a commit here; change the image deliberately, and check that the
    # build still matches the committed fonts before relying on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FILLAPRINT_REQUIRE_REFERENCE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # On a pull request HEAD is its merge into the base branch; HEAD^1, the base, shows whether the
          # pull request itself changes fonts/.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "--only-binary=:all:" -r requirements.txt
      # requirements.txt intentionally omits uharfbuzz, so fontTools falls back to its
      # pure-Python GPOS packer here. That packer's output is what the committed fonts were
      # built with; installing uharfbuzz would change GPOS packing and break the comparison
      # below (see docs/DEVELOPMENT.md's reproducibility notes).
      - name: build the fonts from these sources
        run: python build.py
      # These run at the build's exact tolerances with nothing skipped: the tests that compare fonts with
      # sources check the fonts just built.
      - name: test the fonts just built
        run: python -m unittest -v tests.test_beadjoint tests.test_release
      - name: compare the committed fonts with the build
        env:
          EVENT: ${{ github.event_name }}
        run: |
          stale="$(git status --porcelain fonts)"
          if [ -z "$stale" ]; then
            echo "The committed fonts match the fonts built from these sources."
            exit 0
          fi
          echo "$stale"
          if [ "$EVENT" != "pull_request" ]; then
            echo "::error title=Committed fonts do not match the sources::Rebuild the fonts with python build.py in the pinned environment on Linux and commit fonts/ (docs/RELEASING.md)."
            exit 1
          fi
          if ! git rev-parse -q --verify 'HEAD^1' > /dev/null; then
            echo "::error title=Cannot tell whether this pull request changes fonts/::The base commit HEAD^1 is missing from the checkout."
            exit 1
          fi
          if ! git diff --quiet 'HEAD^1' HEAD -- fonts; then
            echo "::error title=The pull request's fonts do not match its sources::This pull request changes fonts/, but they differ from a build of its sources. Rebuild them with python build.py in the pinned environment on Linux (docs/RELEASING.md), or leave fonts/ as it is on the base branch."
            exit 1
          fi
          echo "::notice title=Committed fonts predate the sources::The fonts built from this pull request's sources passed the build and the font tests. The pull request leaves fonts/ as it is, as docs/TUNER.md asks; the fonts are rebuilt before the change lands on main."
          {
            echo "### Committed fonts predate the sources"
            echo
            echo "The fonts built from this pull request's sources passed \`build.py\` and the font tests."
            echo "The committed fonts differ from them, which is expected for a source-only contribution: they are"
            echo "rebuilt on Linux before the change lands on \`main\`, where this difference fails the job."
            echo
            echo '```'
            echo "$stale"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
